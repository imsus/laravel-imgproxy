# Moat configuration: https://github.com/laravel/moat
#
# This repository is maintained by a single maintainer. GitHub does not allow a
# maintainer to approve their own pull request, and there is no second
# maintainer/collaborator, so the "pull requests require reviews" check cannot
# be satisfied. The repo intentionally uses required_approving_review_count = 0
# on its release branches (main, v1) to keep the maintainer able to merge.
[checks]
repositories_pull_requests_require_reviews = "off"
